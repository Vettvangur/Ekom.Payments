name: release-please

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

# Release runs share component branches and one manifest; never run concurrently.
concurrency:
  group: release-please-main
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: windows-latest
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
